name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://ci:ci@localhost:5432/ci?schema=public' }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'ci-placeholder-secret-not-used-for-anything' }}
      NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL || 'http://localhost:3000' }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production

    # The Vercel CLI reads these two from the environment rather than from a
    # flag; together they are what `.vercel/project.json` holds locally, and
    # without them `vercel pull` has a token but no idea which project to pull.
    #
    # VERCEL_TOKEN must be scoped to the team that owns this project. A token
    # minted under a personal account authenticates successfully and then
    # cannot see the project, which surfaces as the same "Could not retrieve
    # Project Settings" error as a missing id — so scope it narrowly and treat
    # it as granting deploy rights to this project alone.
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Apply migrations
        run: npm run migrate:deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Check Vercel credentials
        run: |
          : "${VERCEL_ORG_ID:?is empty — add it as a repository secret (orgId in .vercel/project.json)}"
          : "${VERCEL_PROJECT_ID:?is empty — add it as a repository secret (projectId in .vercel/project.json)}"
          : "${VERCEL_TOKEN:?is empty — add it as a repository secret, scoped to the team owning this project}"
          echo "org ${VERCEL_ORG_ID:0:9}… project ${VERCEL_PROJECT_ID:0:9}…"

          # Present is not the same as usable: ask the API whether this token can
          # actually see this project, because `vercel pull` reports a token that
          # cannot and an id that does not exist as the same unhelpful
          # "Could not retrieve Project Settings".
          body=$(mktemp)
          code=$(curl -sS -o "$body" -w '%{http_code}' \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID")

          if [ "$code" = 200 ]; then
            echo "token can read project $(jq -r .name "$body")"
            exit 0
          fi

          echo "Vercel API answered $code for this project:"
          jq -r '.error.message // tostring' "$body" 2>/dev/null || cat "$body"
          echo
          echo "401 means the token is invalid or expired. 403/404 means it is valid"
          echo "but scoped somewhere that cannot see this project — a personal-account"
          echo "token cannot read a team-owned one. Mint a replacement at"
          echo "https://vercel.com/account/settings/tokens with the scope set to the"
          echo "team, then update the VERCEL_TOKEN secret."
          exit 1
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
